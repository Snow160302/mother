/* M.O.T.H.E.R / Tipografia VT323 + White Rabbit */

body,.content,.boot,textarea,.spreadsheet input{font-family:var(--font-terminal)}
h1,h2,h3,.eyebrow,.status,.admin-tag,th,.metadata,.tile b{font-family:var(--font-display)}
button,.btn,input,select,textarea,label{font-family:var(--font-terminal)}
h1{font-size:clamp(26px,4.3vw,52px);line-height:1.27}
h2{font-size:clamp(20px,2.1vw,28px)}
h3{font-size:19px}

/* AV_2663 : ARCHIVO EN ESTADO DE ABANDONO / EDICION OMINOSA */
:root{--green:#b4d0b6;--bright:#eef7e8;--dim:#7f9782;--black:#020403;--edge:#4b5f4e;--shadow:0 0 7px #b5dcb560;--scan:.6;--amber:#d2a97a;--amber-dim:#9a7752}
html{background:#000}
body{background:radial-gradient(ellipse 70% 78% at 49% 37%,#101714 0%,#060b08 58%,#010201 100%);color:var(--green);text-shadow:0 0 2px #c8e6c840;letter-spacing:.045em}
body:before{background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,rgba(0,0,0,.16) 4px,rgba(0,0,0,.16) 5px);opacity:var(--scan,.6)}
body:after{box-shadow:inset 0 0 90px 22px #0008,inset 0 0 220px 70px #0008; background:transparent;animation:motherFlicker 19s infinite}
@keyframes motherFlicker{0%,13%,13.3%,47%,47.4%,79%,79.2%,100%{opacity:1}13.15%,47.2%,79.1%{opacity:.75}}
.shell{max-width:1120px;padding-top:36px}
.mast{border-bottom:1px solid #354a35;padding-bottom:27px;margin-bottom:29px;position:relative}
.mast:after{content:'CORPORATE ARCHIVE // RECOVERED NODE 07';position:absolute;bottom:-12px;left:0;background:#060b08;padding:0 10px 0 0;font:14px 'White Rabbit','VT323',monospace;color:#90a791;letter-spacing:.13em}
h1{color:#dfe9d9;text-shadow:0 0 10px #d0e7cf2f,0 0 24px #99bf9930;letter-spacing:.18em}
h2{color:#a2b79f}h3{color:#8aa489}
.eyebrow{color:#647960;letter-spacing:.2em}
.status{color:#8ba28e}.status strong{color:#dfe9d9;animation:statusPulse 6s infinite}

.tile{background:#0a100d;border-color:#455747;position:relative;transition:background .28s,border-color .28s,box-shadow .28s}
.tile:before{content:'+';position:absolute;right:15px;top:10px;color:#4b6450;font:20px 'VT323',monospace}
.tile:hover,.tile:focus-visible{background:#121a15;border-color:#c4d2bd;box-shadow:inset 0 0 24px #152017}
.tile b{color:#eef7e8}.tile small{color:#8ba08e}
button,.btn,input,select,textarea{background:#08100b;border-color:#4a5d4d;color:#d4e1d2}
button:hover,.btn:hover,button:focus-visible,.btn:focus-visible{background:#1a2620;border-color:#e4efe0;color:#ffffff;box-shadow:0 0 8px #d7ead440}
button.primary{background:#1b2620;border-color:#90a992;color:#f1f7ed}
label,.muted{color:#97ac99}
.notice{border-left-color:var(--amber);background:#12100b;color:#d8c0a4}

.content{color:#dbe6d7}footer{border-color:#394c3d;color:#86a089}
.boot{color:#dbe6d7;line-height:1.65;white-space:pre-wrap;max-width:840px}

   const {data}=await sb.from('attachments').select('*').eq('document_id',id);

}
function admin(){layout(nav()+`<div class="eyebrow">SECURE AREA / ADMINISTRATOR AUTHORIZED</div><h2>SYSTEM ADMINISTRATION</h2><section class="pc-window"><div class="pc-topline">PERSONAL TERMINAL</div><div class="window-tabs"><span class="win-tab active">ADMIN</span><span class="win-tab">CONTROL NODE</span></div><div class="window-body"><div class="admin-air-grid">${[['CREAR ARCHIVO','create','SYS 01'],['EDITAR / ARCHIVAR DOCUMENTOS','adminDocs','SYS 02'],['GESTIÓN DE WHITELIST','users','SYS 03'],['CONFIGURACIÓN','config','SYS 04']].map(([t,v,code])=>`<button class="admin-air-card" data-admin="${v}"><span class="microline">${code}</span><b>${t}</b><small>EXECUTE</small></button>`).join('')}</div><p class="warning small">${mode==='demo'?'DEMO LOCAL: DATOS SOLO EN ESTE NAVEGADOR. NO UTILIZAR COMO ARCHIVO PROTEGIDO.':'DATABASE SECURITY ENABLED: ENFORCED BY SUPABASE RLS.'}</p></div></section>`);wireNav();document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>{editing=false;doc=null;go(b.dataset.admin)})}
async function adminDocs(){layout(nav()+`<div class="eyebrow">SECURE AREA / DOCUMENT CONTROL</div><h2>DOCUMENT CONTROL</h2><section class="pc-window"><div class="pc-topline">PERSONAL TERMINAL</div><div class="window-tabs"><span class="win-tab active">CONTROL</span><span class="win-tab">ARCHIVE FILES</span></div><div class="window-body"><div id="results" class="box muted">LOADING...</div></div></section>`);wireNav();try{const rows=await fetchOwnAllDocs();$('results').innerHTML=`<div class="tablewrap"><table><tr><th>ID</th><th>DOCUMENTO</th><th>NIVEL</th><th>ESTADO</th><th>OPERACIONES</th></tr>${rows.map(d=>`<tr><td>${esc(d.document_code)}</td><td>${esc(d.title)}</td><td>${d.clearance_level}</td><td>${esc(d.status)}</td><td><button data-edit="${d.id}">EDITAR</button> <button class="danger" data-archive="${d.id}">ARCHIVAR</button></td></tr>`).join('')}</table></div>`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{doc=rows.find(x=>x.id===b.dataset.edit);editing=true;formCat=CATS.indexOf(doc.category);go('create')});document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Archivar expediente? No aparecerá en el índice.'))return;try{if(mode==='demo'){const d=store.documents.find(x=>x.id===b.dataset.archive);d.status='archived';save()}else{const {error}=await sb.from('documents').update({status:'archived'}).eq('id',b.dataset.archive);if(error)throw error}adminDocs()}catch(e){flash(e.message,true)}})}catch(e){flash(e.message,true)}}
const field=(id,label,value='',type='text',required=false)=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" ${required?'required':''} value="${esc(value)}"></div>`,area=(id,label,value='')=>`<div class="field"><label for="${id}">${label}</label><textarea id="${id}" rows="8">${esc(value)}</textarea></div>`;
function formPage(){const x=doc?.extra||{};if(!editing)doc=null;const sec=editing?formCat:formCat;let specific='';if(sec===0)specific=`<div class="cols">${field('full_name','NOMBRE COMPLETO',x.full_name,'text',true)}${field('blood_type','GRUPO SANGUÍNEO',x.blood_type)}${field('date_of_birth','FECHA NACIMIENTO',x.date_of_birth,'date')}${field('date_of_death','FECHA DEFUNCIÓN',x.date_of_death,'date')}${field('height_cm','ALTURA (CM)',x.height_cm,'number')}${field('weight_kg','PESO (KG)',x.weight_kg,'number')}${field('location','LOCALIZACIÓN',x.location)}${field('occupation','OCUPACIÓN',x.occupation)}</div>${area('last_records','ÚLTIMOS REGISTROS',x.last_records||'')}`;
if(sec===2)specific=`${field('table_title','TÍTULO DE TABLA',x.registry?.title||'DATA LOG')}<div class="topline"><h3>CONSTRUCTOR DE TABLAS</h3><div class="row-actions"><button type="button" id="addcol">+ COLUMNA</button><button type="button" id="addrow">+ FILA</button><button type="button" id="delrow">− FILA</button></div></div><div id="tableeditor"></div><div class="field"><label>IMPORTAR TABLA DESDE EXCEL (.XLSX, .XLS, .CSV)</label><input id="excel" type="file" accept=".xlsx,.xls,.csv"><small>Se importará la primera hoja y podrás editar sus valores antes de guardar.</small></div>`;
if(sec===3)specific='<div class="notice">CLASSIFIED INFORMATION — EL NIVEL ELEGIDO RESTRINGE EL ACCESO A ESTE EXPEDIENTE.</div>';
layout(nav()+`<div class="eyebrow">ADMIN / ${editing?'EDIT EXISTING':'NEW RECORD'}</div><h2>${editing?'EDITAR ARCHIVO':'CREAR NUEVO ARCHIVO'}</h2>${!editing?`<div class="field"><label>TIPO DE DOCUMENTO</label><select id="doctype">${CATS.map((c,i)=>`<option value="${i}" ${i===sec?'selected':''}>${c}</option>`).join('')}</select></div>`:''}<form id="record"><div class="cols">${field('title',sec===0?'TÍTULO DE FICHA':'TÍTULO',doc?.title||'', 'text',true)}${field('index_title','NOMBRE EN ÍNDICE',doc?.index_title||'','text',true)}${field('author','AUTOR',doc?.author||'')}${field('document_date','FECHA DEL DOCUMENTO',doc?.document_date||today(),'date',true)}<div class="field"><label>NIVEL DE VISIBILIDAD / SEGURIDAD</label><select id="level">${[1,2,3,4,5].map(n=>`<option value="${n}" ${+(doc?.clearance_level||1)===n?'selected':''}>${n} — ${LEVELS[n]}</option>`).join('')}</select></div><div class="field"><label>ESTADO</label><select id="status"><option value="published" ${doc?.status!=='draft'?'selected':''}>PUBLICADO</option><option value="draft" ${doc?.status==='draft'?'selected':''}>BORRADOR</option></select></div></div>${specific}${area('content',sec===0?'INFORMACIÓN ADICIONAL':'CUERPO DEL DOCUMENTO',doc?.content||'')}<div class="field"><label>IMÁGENES / DOCUMENTOS ADJUNTOS</label><input type="file" id="uploads" multiple accept=".pdf,.txt,.docx,.xlsx,.xls,.csv,.jpg,.jpeg,.png,.webp"><small>Admite varios archivos. En la DEMO solo se guardarán los nombres; con Supabase se guardan en Storage privado.</small></div><div class="actions"><button class="primary" type="submit">[ ${editing?'GUARDAR CAMBIOS':'CREAR ARCHIVO'} ]</button><button type="button" id="cancel">[ CANCELAR ]</button></div></form>`);wireNav();$('cancel').onclick=()=>go('admin');if($('doctype'))$('doctype').onchange=()=>{formCat=+$('doctype').value;formPage()};if(sec===2){registry=x.registry?structuredClone(x.registry):{title:'DATA LOG',columns:['CAMPO','VALOR'],rows:[['001','ACTIVE']]};renderEditor();$('addcol').onclick=()=>{captureEditor();registry.columns.push('COLUMNA '+(registry.columns.length+1));registry.rows.forEach(r=>r.push(''));renderEditor()};$('addrow').onclick=()=>{captureEditor();registry.rows.push(registry.columns.map(() =>''));renderEditor()};$('delrow').onclick=()=>{captureEditor();registry.rows.pop();renderEditor()};$('excel').onchange=async()=>{try{const f=$('excel').files[0];if(!f)return;if(f.size>10*1024*1024)throw Error('EL ARCHIVO SUPERA 10 MB');const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});const sheet=wb.Sheets[wb.SheetNames[0]],raw=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});if(!raw.length)throw Error('HOJA VACÍA');registry={title:$('table_title').value,columns:raw[0].map(String),rows:raw.slice(1,1001).map(r=>raw[0].map((_,i)=>String(r[i]??'')))};renderEditor();flash('TABLA IMPORTADA / '+registry.rows.length+' FILAS')}catch(e){flash(e.message,true)}}}
$('record').onsubmit=submitRecord}
function renderEditor(){$('tableeditor').innerHTML=`<div class="tablewrap spreadsheet"><table><thead><tr><th>#</th>${registry.columns.map((c,i)=>`<th><input aria-label="Nombre columna ${i+1}" data-head="${i}" value="${esc(c)}"></th>`).join('')}</tr></thead><tbody>${registry.rows.map((row,i)=>`<tr><td>${i+1}</td>${registry.columns.map((_,j)=>`<td><input data-cell="${i}:${j}" aria-label="Fila ${i+1} columna ${j+1}" value="${esc(row[j]||'')}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function captureEditor(){document.querySelectorAll('[data-head]').forEach(i=>registry.columns[+i.dataset.head]=i.value);document.querySelectorAll('[data-cell]').forEach(i=>{const [r,c]=i.dataset.cell.split(':').map(Number);registry.rows[r][c]=i.value})}
async function submitRecord(e){e.preventDefault();const s=formCat,extras=editing?structuredClone(doc.extra||{}):{},get=k=>$(k)?.value||'';if(s===0)['full_name','blood_type','date_of_birth','date_of_death','height_cm','weight_kg','location','occupation','last_records'].forEach(k=>extras[k]=get(k));if(s===2){captureEditor();registry.title=get('table_title');extras.registry=registry}const data={category:CATS[s],title:get('title'),index_title:get('index_title'),author:get('author'),document_date:get('document_date'),clearance_level:+get('level'),status:get('status'),content:get('content'),extra:extras};const btn=e.submitter;if(btn)btn.disabled=true;try{let id=doc?.id;if(mode==='demo'){if(editing){Object.assign(store.documents.find(d=>d.id===id),data)}else{id=uid();data.id=id;data.document_code=PREFIX[s]+'-'+String(store.documents.filter(d=>d.category===CATS[s]).length+1).padStart(4,'0');data.created_at=new Date().toISOString();store.documents.push(data)}const fs=[...$('uploads').files];const d=store.documents.find(z=>z.id===id);d.files=[...(d.files||[]),...fs.map(f=>({name:f.name}))];save()}else{if(editing){const {error}=await sb.from('documents').update(data).eq('id',id);if(error)throw error}else{const {data:inserted,error}=await sb.from('documents').insert(data).select('id').single();if(error)throw error;id=inserted.id}for(const f of [...$('uploads').files]){if(f.size>15*1024*1024)throw Error('TAMAÑO DE ARCHIVO EXCEDIDO: '+f.name);const path=id+'/'+uid()+'/'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error:uploadError}=await sb.storage.from('mother-files').upload(path,f,{upsert:false});if(uploadError)throw uploadError;const {error:metaError}=await sb.from('attachments').insert({document_id:id,path,filename:f.name,mime_type:f.type,file_size:f.size});if(metaError)throw metaError}}editing=false;doc=null;formCat=0;go('adminDocs');flash('ARCHIVO GUARDADO CORRECTAMENTE')}catch(err){flash(err.message,true)}finally{if(btn)btn.disabled=false}}
async function usersPage(){layout(nav()+`<h2>USER ACCESS CONTROL / WHITELIST</h2><div class="box"><form id="adduser"><div class="cols">${field('newemail','CORREO AUTORIZADO','','email',true)}<div class="field"><label>NIVEL DE SEGURIDAD</label><select id="newlevel">${[1,2,3,4,5].map(n=>`<option value="${n}">${n} — ${LEVELS[n]}</option>`).join('')}</select></div></div><button type="submit">[ AUTORIZAR USUARIO ]</button></form></div><div id="users">LOADING PERSONNEL...</div>`);wireNav();$('adduser').onsubmit=async e=>{e.preventDefault();try{const mail=$('newemail').value.trim().toLowerCase();if(mode==='demo'){if(store.users.some(u=>u.email===mail))throw Error('USUARIO YA EXISTENTE');store.users.push({email:mail,clearance_level:+$('newlevel').value,role:'viewer',status:'active'});save()}else{const {error}=await sb.from('allowed_users').insert({email:mail,clearance_level:+$('newlevel').value,role:'viewer',status:'active'});if(error)throw error}usersPage();flash('USUARIO AÑADIDO A WHITELIST')}catch(e){flash(e.message,true)}};try{let rows;if(mode==='demo')rows=store.users;else{const {data,error}=await sb.from('allowed_users').select('*').order('email');if(error)throw error;rows=data||[]} $('users').innerHTML=`<div class="tablewrap"><table><tr><th>EMAIL</th><th>RANGO</th><th>ESTADO</th><th>OPERACIÓN</th></tr>${rows.map(u=>`<tr><td>${esc(u.email)} ${u.role==='admin'?'[ADMIN]':''}</td><td><select data-level="${esc(u.email)}" ${u.email===ADMIN_EMAIL?'disabled':''}>${[1,2,3,4,5].map(n=>`<option value="${n}" ${+u.clearance_level===n?'selected':''}>${n}</option>`).join('')}</select></td><td><select data-status="${esc(u.email)}" ${u.email===ADMIN_EMAIL?'disabled':''}><option value="active" ${u.status==='active'?'selected':''}>ACTIVE</option><option value="suspended" ${u.status==='suspended'?'selected':''}>SUSPENDED</option></select></td><td><button data-saveuser="${esc(u.email)}" ${u.email===ADMIN_EMAIL?'disabled':''}>GUARDAR</button></td></tr>`).join('')}</table></div>`;document.querySelectorAll('[data-saveuser]').forEach(b=>b.onclick=async()=>{try{const email=b.dataset.saveuser,lv=+document.querySelector('[data-level="'+CSS.escape(email)+'"]').value,status=document.querySelector('[data-status="'+CSS.escape(email)+'"]').value;if(mode==='demo'){Object.assign(store.users.find(u=>u.email===email),{clearance_level:lv,status});save()}else{const {error}=await sb.from('allowed_users').update({clearance_level:lv,status}).eq('email',email);if(error)throw error}flash('PERMISSIONS UPDATED')}catch(e){flash(e.message,true)}})}catch(e){flash(e.message,true)}}
function configPage(){const cfg=readConfig();layout(nav()+`<h2>SYSTEM CONFIGURATION</h2><div class="box"><p>DISPLAY HARDWARE</p><button id="crtbutton">TOGGLE CRT FILTER</button> <button id="bootbutton">RESTART BOOT SEQUENCE</button></div><div class="box"><h3>DATABASE CONNECTION</h3><p class="small muted">${sb?'SUPABASE CONNECTED TO '+esc(cfg.url):'NO SUPABASE PROJECT CONFIGURED'}</p><button id="configure">SET / CHANGE SUPABASE CONNECTION</button><p class="warning small">No pegues claves privadas. El proyecto SQL debe instalarse antes de acceder con usuarios reales.</p></div>`);wireNav();$('crtbutton').onclick=()=>{$('crt').click()};$('bootbutton').onclick=splash;$('configure').onclick=()=>{if(!confirm('Cambiar conexión cerrará esta sesión. ¿Continuar?'))return;user=null;setupPage()}}
async function start(){if(mode==='supabase'&&sb){const {data}=await sb.auth.getUser();if(data?.user){await sessionToUser(data.user);return}}if(mode==='demo'){mode='none';localStorage.removeItem('mother_mode')}splash()}
start();
})();
</script></body></html>
