/* M.O.T.H.E.R / Tipografia VT323 + White Rabbit */

body,.content,.boot,textarea,.spreadsheet input{font-family:var(--font-terminal)}
h1,h2,h3,.eyebrow,.status,.admin-tag,th,.metadata,.tile b{font-family:var(--font-display)}
button,.btn,input,select,textarea,label{font-family:var(--font-terminal)}
h1{font-size:clamp(26px,4.3vw,52px);line-height:1.27}
h2{font-size:clamp(20px,2.1vw,28px)}
h3{font-size:19px}

/* AV_2663 : ARCHIVO EN ESTADO DE ABANDONO / EDICION OMINOSA */
:root{--green:#b4d0b6;--bright:#eef7e8;--dim:#7f9782;--black:#020403;--edge:#4b5f4e;--shadow:0 0 7px #b5dcb560;--scan:.6;--amber:#d2a97a;--amber-dim:#9a7752}
html{background:#000}
body{background:radial-gradient(ellipse 70% 78% at 49% 37%,#101714 0%,#060b08 58%,#010201 100%);color:var(--green);text-shadow:0 0 2px #c8e6c840;letter-spacing:.045em}
body:before{background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,rgba(0,0,0,.16) 4px,rgba(0,0,0,.16) 5px);opacity:var(--scan,.6)}
body:after{box-shadow:inset 0 0 90px 22px #0008,inset 0 0 220px 70px #0008; background:transparent;animation:motherFlicker 19s infinite}
@keyframes motherFlicker{0%,13%,13.3%,47%,47.4%,79%,79.2%,100%{opacity:1}13.15%,47.2%,79.1%{opacity:.75}}
.shell{max-width:1120px;padding-top:36px}
.mast{border-bottom:1px solid #354a35;padding-bottom:27px;margin-bottom:29px;position:relative}
.mast:after{content:'CORPORATE ARCHIVE // RECOVERED NODE 07';position:absolute;bottom:-12px;left:0;background:#060b08;padding:0 10px 0 0;font:14px 'White Rabbit','VT323',monospace;color:#90a791;letter-spacing:.13em}
h1{color:#dfe9d9;text-shadow:0 0 10px #d0e7cf2f,0 0 24px #99bf9930;letter-spacing:.18em}
h2{color:#a2b79f}h3{color:#8aa489}
.eyebrow{color:#647960;letter-spacing:.2em}
.status{color:#8ba28e}.status strong{color:#dfe9d9;animation:statusPulse 6s infinite}

.tile{background:#0a100d;border-color:#455747;position:relative;transition:background .28s,border-color .28s,box-shadow .28s}
.tile:before{content:'+';position:absolute;right:15px;top:10px;color:#4b6450;font:20px 'VT323',monospace}
.tile:hover,.tile:focus-visible{background:#121a15;border-color:#c4d2bd;box-shadow:inset 0 0 24px #152017}
.tile b{color:#eef7e8}.tile small{color:#8ba08e}
button,.btn,input,select,textarea{background:#08100b;border-color:#4a5d4d;color:#d4e1d2}
button:hover,.btn:hover,button:focus-visible,.btn:focus-visible{background:#1a2620;border-color:#e4efe0;color:#ffffff;box-shadow:0 0 8px #d7ead440}
button.primary{background:#1b2620;border-color:#90a992;color:#f1f7ed}
label,.muted{color:#97ac99}
.notice{border-left-color:var(--amber);background:#12100b;color:#d8c0a4}

.content{color:#dbe6d7}footer{border-color:#394c3d;color:#86a089}
.boot{color:#dbe6d7;line-height:1.65;white-space:pre-wrap;max-width:840px}
